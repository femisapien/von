name: Sync Model Card to Hugging Face

on:
  push:
    branches:
      - master
    paths:
      - "hf/MODEL_CARD.md"
      - "hf/assets/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

jobs:
  sync-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Sync model card and assets to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise RuntimeError("Missing HF_TOKEN secret!")

          api = HfApi(token=token)
          repo_id = "wfzyx/von"

          # Upload updated model card
          # hf/MODEL_CARD.md is the real model card: it carries the YAML metadata
          # block the Hub requires. The project README has no frontmatter, which is
          # what produced "empty or missing yaml metadata in repo card".
          card_path = "hf/MODEL_CARD.md"
          if os.path.exists(card_path):
              print(f"Uploading {card_path} to {repo_id}...")
              api.upload_file(
                  path_or_fileobj=card_path,
                  path_in_repo="README.md",
                  repo_id=repo_id,
                  repo_type="model",
              )

          # Card figures live under hf/assets/ and are referenced relatively by the card.
          import glob
          for img_path in sorted(glob.glob("hf/assets/*.png")):
              rel = os.path.relpath(img_path, "hf")
              print(f"Uploading {img_path} -> {rel}...")
              api.upload_file(path_or_fileobj=img_path, path_in_repo=rel,
                              repo_id=repo_id, repo_type="model")

          print("Successfully synced model card and assets to Hugging Face Hub!")
          EOF
