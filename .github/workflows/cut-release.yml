name: Cut a Release

# The single release pipeline. Every publish surface hangs off this one run
# with `needs`, so a release is either complete or visibly failed -- no more
# "PyPI went out, npm quietly stayed three versions behind".
#
#   bump    -- scripts/bump_version.py rewrites every version site
#              (pyproject, __init__, uv.lock, js/package.json, VON_VERSION,
#              VON_MODEL_ID, js VON_MODEL, hf/MODEL_CARD.md), commits
#              "version: X.Y.Z" to master if anything changed, and
#              scripts/check_release.py proves they all agree. No-op if the
#              tree already carries the version.
#   test    -- full pytest + bun test on the bumped commit.
#   tag     -- annotated tag on the bumped commit + GitHub Release.
#   pypi    -- publish-pypi.yml (workflow_call, OIDC trusted publishing)
#   npm     -- publish-npm.yml  (workflow_call, OIDC provenance)
#   hf-card -- sync-hf-card.yml (model card -> huggingface.co/wfzyx/von)
#   verify  -- registries actually serve the version.
#
# To release:  gh workflow run cut-release.yml -f version=X.Y.Z
# (or Actions -> "Cut a Release" -> Run workflow). Nothing to edit by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.3.2, no leading v)"
        required: true

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Refuse to re-cut an existing tag
        run: |
          set -euo pipefail
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists."
            exit 1
          fi
      - name: Bump every version site
        run: python3 scripts/bump_version.py "${{ inputs.version }}"
      - name: Version lockstep
        run: python3 scripts/check_release.py --expect "${{ inputs.version }}"
      - name: Commit the bump (no-op if already at this version)
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "tree already at ${{ inputs.version }}; nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "version: ${{ inputs.version }}"
            git push origin HEAD:master
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: pytest
        run: uv run pytest -q
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: bun test
        working-directory: js
        run: bun install --frozen-lockfile && bun run build && bun test

  tag:
    needs: [bump, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0
      - name: Create and push the tag
        run: |
          set -euo pipefail
          git tag "v${{ inputs.version }}" "${{ needs.bump.outputs.sha }}"
          git push origin "v${{ inputs.version }}"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${{ inputs.version }}" \
            --title "von-sdk ${{ inputs.version }}" \
            --verify-tag \
            --generate-notes

  pypi:
    needs: [bump, tag]
    uses: ./.github/workflows/publish-pypi.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ inputs.version }}
      dry_run: false
      ref: ${{ needs.bump.outputs.sha }}

  npm:
    needs: [bump, tag]
    uses: ./.github/workflows/publish-npm.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ inputs.version }}
      dry_run: false
      ref: ${{ needs.bump.outputs.sha }}

  hf-card:
    needs: [bump, tag]
    uses: ./.github/workflows/sync-hf-card.yml
    secrets: inherit
    with:
      ref: ${{ needs.bump.outputs.sha }}

  verify:
    needs: [pypi, npm, hf-card]
    runs-on: ubuntu-latest
    steps:
      - name: Registries serve ${{ inputs.version }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          for i in $(seq 1 12); do
            PY=$(curl -s https://pypi.org/pypi/von-sdk/json | python3 -c 'import json,sys;print(json.load(sys.stdin)["info"]["version"])' || true)
            NPM=$(npm view von-sdk version 2>/dev/null || true)
            # fetch to a file first: grep -m1 closes the pipe early, curl exits 23 and pipefail empties HF
            curl -fsSL -H 'Cache-Control: no-cache' -o /tmp/hf_card.md https://huggingface.co/wfzyx/von/resolve/main/README.md || true
            HF=$(grep -m1 -oE 'von-sdk>=[0-9.]+' /tmp/hf_card.md 2>/dev/null | cut -d= -f3 || true)
            echo "attempt $i: pypi=$PY npm=$NPM hf=$HF"
            [ "$PY" = "$V" ] && [ "$NPM" = "$V" ] && [ "$HF" = "$V" ] && break
            sleep 20
          done
          [ "$PY" = "$V" ] || { echo "::error::PyPI serves $PY, expected $V"; exit 1; }
          [ "$NPM" = "$V" ] || { echo "::error::npm serves $NPM, expected $V"; exit 1; }
          [ "$HF" = "$V" ] || { echo "::error::HF model card pins von-sdk>=$HF, expected $V"; exit 1; }
          {
            echo "### Released v$V"
            echo "- https://github.com/${{ github.repository }}/releases/tag/v$V"
            echo "- https://pypi.org/project/von-sdk/$V/"
            echo "- https://www.npmjs.com/package/von-sdk/v/$V"
            echo "- https://huggingface.co/wfzyx/von"
          } >> "$GITHUB_STEP_SUMMARY"
